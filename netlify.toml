# Kaada Group · kaadagroup.com — site statique, publié tel quel
[build]
  publish = "."

# En-têtes de sécurité appliqués à toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-V8wOssMoYr2SvS1HcWhAF5OleUCNn690ARtsKrG9B3Y='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Fichiers internes au dépôt, jamais servis
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

# Data4Child est un module de Sankora : ses pages vivent sous /sankora/data4child/
# (anciennes adresses redirigées définitivement, 301)
[[redirects]]
  from = "/data4child"
  to = "/sankora/data4child/"
  status = 301
  force = true
[[redirects]]
  from = "/data4child.html"
  to = "/sankora/data4child/"
  status = 301
  force = true
[[redirects]]
  from = "/data4child-fonctionnement"
  to = "/sankora/data4child/fonctionnement"
  status = 301
  force = true
[[redirects]]
  from = "/data4child-fonctionnement.html"
  to = "/sankora/data4child/fonctionnement"
  status = 301
  force = true
[[redirects]]
  from = "/en/data4child"
  to = "/en/sankora/data4child/"
  status = 301
  force = true
[[redirects]]
  from = "/en/data4child.html"
  to = "/en/sankora/data4child/"
  status = 301
  force = true
[[redirects]]
  from = "/en/data4child-fonctionnement"
  to = "/en/sankora/data4child/fonctionnement"
  status = 301
  force = true
[[redirects]]
  from = "/en/data4child-fonctionnement.html"
  to = "/en/sankora/data4child/fonctionnement"
  status = 301
  force = true

# /sankora reste servie par sankora.html, même à côté du dossier sankora/
[[redirects]]
  from = "/sankora"
  to = "/sankora.html"
  status = 200
  force = true
[[redirects]]
  from = "/sankora/"
  to = "/sankora"
  status = 301
  force = true
[[redirects]]
  from = "/en/sankora"
  to = "/en/sankora.html"
  status = 200
  force = true
[[redirects]]
  from = "/en/sankora/"
  to = "/en/sankora"
  status = 301
  force = true

# Page Équipe retirée (oct. 2026) : anciennes adresses redirigées vers À propos
[[redirects]]
  from = "/equipe"
  to = "/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/equipe.html"
  to = "/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/en/equipe"
  to = "/en/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/en/equipe.html"
  to = "/en/a-propos"
  status = 301
  force = true
